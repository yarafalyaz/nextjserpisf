services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: silengkap_dev_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - TZ=Asia/Jakarta
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mysql://${DB_USER:-silengkap_user}:${DB_PASSWORD:-silengkap_pass123}@db:3306/${DB_NAME:-silengkap}?allowPublicKeyRetrieval=true
      # AUTH_SECRET sengaja TIDAK di-override di sini: `env_file` di atas sudah
      # memuatnya dari .env. Sebelumnya baris ini memakai default
      # "your-secret-key-change-in-production", yang menimpa .env dan membuat
      # sesi (JWE) bisa dipalsukan siapa pun yang tahu nilai default itu.
      - NEXTAUTH_URL=http://localhost:3005
      - AUTH_TRUST_HOST=true
      # Deliberately NOT setting TRUSTED_PROXY: the dev app is reached directly on
      # :3005 with no proxy in front, so client-IP headers must stay untrusted.
      # See .env.example for the production guidance.
      # Polling watcher (1s): Docker Desktop di macOS menghilangkan event
      # filesystem host→VM, terutama hapus/pindah file — tanpa ini route lama
      # terus disajikan sampai container restart. Lihat next.config.ts.
      - WATCH_POLLING_MS=1000
    ports:
      - "3005:3001"
    volumes:
      - .:/app
      - /app/node_modules
      # Dev writes to `.next-dev` (see next.config.ts). Mount that as the
      # anonymous volume so the container's Turbopack cache never touches the
      # host's prod `.next` — the old `/app/.next` mount made Docker apply a
      # `deny delete` ACL to the host dir, so a host `next build` (which starts
      # with `rm -rf .next`) failed with "Permission denied".
      - /app/.next-dev
      - ./public/uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Pemicu sinkronisasi libur nasional dari dalam jaringan compose:
  # memanggil /api/cron/sync-holidays di app saat start lalu tiap 30
  # hari. Idempoten; lihat docker-compose.prod.yml untuk catatan penuh.
  holiday-sync:
    image: curlimages/curl:8.10.1
    container_name: silengkap_dev_holiday_sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      - app
    command:
      - sh
      - -c
      - |
        for i in $(seq 1 12); do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3001/api/cron/sync-holidays && break || sleep 10
        done
        while true; do
          sleep 2592000
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3001/api/cron/sync-holidays || echo "holiday-sync: panggilan gagal, dicoba lagi siklus berikutnya"
        done

  db:
    image: mysql:8.0
    container_name: silengkap_dev_db
    restart: unless-stopped
    # Silence stock-image startup warnings that do not apply to a local dev DB:
    # deprecated --skip-host-cache (via docker/mysql.cnf below), pid-file in a
    # world-accessible dir, and the X plugin (Prisma uses the classic
    # protocol). TLS stays at the image default: disabling it trades the one
    # self-signed-CA warning for deprecated-syntax warnings instead.
    command:
      - --host-cache-size=0
      - --pid-file=/var/lib/mysql-files/mysqld.pid
      - --mysqlx=OFF
    # MySQL 8 defaults to caching_sha2_password, which the mariadb driver behind
    # PrismaMariaDb supports. The old `--default-authentication-plugin=mysql_native_password`
    # flag is deprecated (warning MY-013360) and removed in MySQL 9, so it is gone.
    # NOTE: the auth plugin is fixed when a user is created, so an existing
    # `silengkap_user` in the `mysql_dev_data` volume stays on mysql_native_password
    # until migrated:
    #   ALTER USER 'silengkap_user'@'%' IDENTIFIED WITH caching_sha2_password BY '<password>';
    #   FLUSH PRIVILEGES;
    # or recreate the dev DB with `docker compose down -v` (wipes local data).
    environment:
      - MYSQL_DATABASE=${DB_NAME:-silengkap}
      - MYSQL_USER=${DB_USER:-silengkap_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-silengkap_pass123}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password_change_me}
      - TZ=Asia/Jakarta
    ports:
      - "3309:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      # Same as the image's /etc/my.cnf minus the deprecated skip-host-cache
      # line (see docker/mysql.cnf); everything else stays identical.
      - ./docker/mysql.cnf:/etc/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_dev_data:
