services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: silengkap_dev_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - TZ=Asia/Jakarta
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mysql://${DB_USER:-silengkap_user}:${DB_PASSWORD:-silengkap_pass123}@db:3306/${DB_NAME:-silengkap}?allowPublicKeyRetrieval=true
      # AUTH_SECRET sengaja TIDAK di-override di sini: `env_file` di atas sudah
      # memuatnya dari .env. Sebelumnya baris ini memakai default
      # "your-secret-key-change-in-production", yang menimpa .env dan membuat
      # sesi (JWE) bisa dipalsukan siapa pun yang tahu nilai default itu.
      - NEXTAUTH_URL=http://localhost:3005
      - AUTH_TRUST_HOST=true
      # Deliberately NOT setting TRUSTED_PROXY: the dev app is reached directly on
      # :3005 with no proxy in front, so client-IP headers must stay untrusted.
      # See .env.example for the production guidance.
    ports:
      - "3005:3001"
    volumes:
      - .:/app
      - /app/node_modules
      # Dev writes to `.next-dev` (see next.config.ts). Mount that as the
      # anonymous volume so the container's Turbopack cache never touches the
      # host's prod `.next` — the old `/app/.next` mount made Docker apply a
      # `deny delete` ACL to the host dir, so a host `next build` (which starts
      # with `rm -rf .next`) failed with "Permission denied".
      - /app/.next-dev
      - ./public/uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: silengkap_dev_db
    restart: unless-stopped
    # MySQL 8 defaults to caching_sha2_password, which the mariadb driver behind
    # PrismaMariaDb supports. The old `--default-authentication-plugin=mysql_native_password`
    # flag is deprecated (warning MY-013360) and removed in MySQL 9, so it is gone.
    # NOTE: the auth plugin is fixed when a user is created, so an existing
    # `silengkap_user` in the `mysql_dev_data` volume stays on mysql_native_password
    # until migrated:
    #   ALTER USER 'silengkap_user'@'%' IDENTIFIED WITH caching_sha2_password BY '<password>';
    #   FLUSH PRIVILEGES;
    # or recreate the dev DB with `docker compose down -v` (wipes local data).
    environment:
      - MYSQL_DATABASE=${DB_NAME:-silengkap}
      - MYSQL_USER=${DB_USER:-silengkap_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-silengkap_pass123}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password_change_me}
      - TZ=Asia/Jakarta
    ports:
      - "3309:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_dev_data:
