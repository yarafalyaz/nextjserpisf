name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npm run lint
      - run: npx tsc --noEmit

  e2e-setup:
    name: E2E Auth Setup
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx prisma db push
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx prisma/seed.ts || true
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx scripts/seed-remaining-e2e.ts || true
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-secret
          AUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
      - name: Run Playwright Auth Setup
        run: npx playwright test --project=setup
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-secret
          AUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
      - name: Upload Auth State
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth
          path: e2e/.auth/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: "E2E Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, e2e-setup]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx prisma db push
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx prisma/seed.ts || true
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx scripts/seed-remaining-e2e.ts || true
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx playwright install --with-deps chromium
      - name: Download Auth State
        uses: actions/download-artifact@v4
        with:
          name: playwright-auth
          path: e2e/.auth
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-secret
          AUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
      - run: npx playwright test --project=chromium --no-deps --workers=2 --shard=$SHARD_INDEX/$SHARD_TOTAL
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-secret
          AUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
          PW_WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
