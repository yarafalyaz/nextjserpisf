name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue (diaktifkan dari Settings GitHub; API menolak pembuatan rule
  # merge_queue untuk repo ini) menjalankan CI pada merge group-nya lewat
  # event ini — tanpa trigger ini antrean tidak pernah menerima check.
  merge_group:
    branches: [main]
  # Dipakai antrean merge buatan sendiri (.github/workflows/antrean-merge.yml):
  # sesudah update-branch oleh token GitHub Actions — push token tidak memicu
  # workflow — CI dipicu ulang manual pada branch PR supaya check wajib lapor
  # untuk commit head terbaru.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Mirror the deployment timezone (docker-compose sets TZ=Asia/Jakarta for the app
  # and the DB). Without it CI runs in UTC and misses the whole class of date bugs
  # where a local-time derivation differs from the UTC one: the report presets and
  # the "today" default of every create form were off by one day only east of UTC.
  TZ: Asia/Jakarta

jobs:
  # Perubahan cuma Markdown (di mana pun, termasuk docs/) tidak menyentuh kode,
  # skema, atau konfigurasi build — job berat di bawah di-skip untuk diff begitu.
  # Skip di level job (bukan paths-ignore workflow) disengaja: check wajib
  # branch protection tetap dilaporkan sebagai skipped (= lulus), bukan hilang
  # tanpa kabar yang bikin PR nyangkut BLOCKED selamanya.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          FILES="$(git diff --name-only $RANGE)"
          echo "Changed files:"
          echo "$FILES"
          # Baris kosong dari diff kosong tidak dihitung sebagai file.
          if [ -z "$FILES" ] || ! printf '%s\n' "$FILES" | grep -qvE '\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only: job berat di-skip."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          # Job Docker Image Build (buildx + smoke, job terberat) di PR hanya
          # bila file yang memengaruhi image berubah; di push main selalu jalan
          # sebagai gerbang akhir. Build Next.js sudah memvalidasi kode, jadi
          # nilai unik job ini adalah kebenaran Dockerfile & kemasan standalone.
          if printf '%s\n' "$FILES" | grep -qE '^(Dockerfile|docker/|\.dockerignore|docker-compose|package(-lock)?\.json|prisma/|next\.config\.)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan terkait Docker: Docker Image Build di-skip untuk PR ini."
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # Preflight install: tolak node_modules/node_modules sampah + pastikan
      # next-auth/@auth/core/jwt ter-resolve sebelum kerja mahal jalan
      # (insiden 2026-10-22: symlink sampah lolos, build gagal di tengah).
      - run: npm run preflight:deps
      # S6505: lifecycle script paket = kode tak terpercaya saat install. Prisma
      # client dibuat eksplisit via langkah `prisma generate` sesudah ini.
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: ./node_modules/.bin/eslint .
      - run: ./node_modules/.bin/tsc --noEmit

  unit:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # Preflight install: tolak node_modules/node_modules sampah + pastikan
      # next-auth/@auth/core/jwt ter-resolve sebelum kerja mahal jalan
      # (insiden 2026-10-22: symlink sampah lolos, build gagal di tengah).
      - run: npm run preflight:deps
      # S6505: lifecycle script paket = kode tak terpercaya saat install. Prisma
      # client dibuat eksplisit via langkah `prisma generate` sesudah ini.
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: ./node_modules/.bin/vitest run
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.changes.outputs.code == 'true' }}
    # Keputusan pemilik: E2E browser dijalankan lokal, GitHub Actions hanya
    # lint + unit + integrasi DB + build produksi. Build tetap memakai service
    # MySQL + `migrate deploy` (tanpa seed). Tidak semua halaman terbukti
    # `force-dynamic`, jadi halaman yang di-prerender masih bisa mengakses DB
    # saat build; tanpa DB nyata build bisa gagal atau menghasilkan output
    # berbeda. `migrate deploy` murah (~30 dtk).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # Preflight install: tolak node_modules/node_modules sampah + pastikan
      # next-auth/@auth/core/jwt ter-resolve sebelum kerja mahal jalan
      # (insiden 2026-10-22: symlink sampah lolos, build gagal di tengah).
      - run: npm run preflight:deps
      # S6505: lifecycle script paket = kode tak terpercaya saat install. Prisma
      # client dibuat eksplisit via langkah `prisma generate` sesudah ini.
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - run: ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      # Gerbang drift: rantai migrasi harus mereproduksi schema.prisma persis
      # (pernah lolos kolom `system_qty` vs `systemQty` yang hanya ketahuan
      # manual). Skrip membuat DB scratch sendiri lalu menghapusnya; root
      # service CI punya hak CREATE DATABASE untuk itu.
      - name: Verify migration chain reproduces schema (drift 0)
        run: node scripts/verify-migrations.mjs
        env:
          MIGRATION_CHECK_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true

  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.changes.outputs.code == 'true' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # Preflight install: tolak node_modules/node_modules sampah + pastikan
      # next-auth/@auth/core/jwt ter-resolve sebelum kerja mahal jalan
      # (insiden 2026-10-22: symlink sampah lolos, build gagal di tengah).
      - run: npm run preflight:deps
      # S6505: lifecycle script paket = kode tak terpercaya saat install. Prisma
      # client dibuat eksplisit via langkah `prisma generate` sesudah ini.
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      # `migrate deploy`, bukan `db push`: rantai migrasi sudah diverifikasi bisa
      # mereproduksi skema dari DB kosong (drift 0). Dengan ini ketidaksesuaian skema vs
      # migrasi GAGAL KERAS, bukan tertutupi — konsekuensinya setiap perubahan skema
      # wajib menyertakan migrasinya.
      - run: ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - run: ./node_modules/.bin/tsx prisma/seed.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
          # Seed guard: demo users (9 akun) hanya dibuat bila eksplisit
          # diizinkan + password admin disediakan. Integrasi DB butuh data seed.
          ALLOW_DEMO_SEED: "true"
          SEED_ADMIN_PASSWORD: Yara1234
      - run: ./node_modules/.bin/tsx scripts/seed-remaining-e2e.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
          # Skrip ini impor env.ts; sesudah R-11 bypass CI=true dicabut, secret
          # wajib ada (32+ char). Nilai tes khusus CI.
          NEXTAUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
      - name: Run DB integration tests (FIFO/multi-UoM/batch/serial engine)
        run: RUN_DB_INTEGRATION=1 ./node_modules/.bin/vitest run src/lib/services/__tests__/inventory-integration.test.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - name: Run DB integration tests (bank statement concurrency, MySQL nyata)
        # Anti-skip: suite ini SKIP seluruhnya (exit 0) bila INTEGRATION_DB_URL
        # kosong, jadi hijau CI bisa berarti 0 tes jalan. Log di-tee lalu
        # digrep: output mengandung 'skipped' (atau tanpa 'passed') = GAGAL.
        run: |
          set -o pipefail
          ./node_modules/.bin/vitest run src/actions/__tests__/bank-statement-concurrency.integration.test.ts 2>&1 | tee bank-statement-concurrency.log
          if grep -qi 'skipped' bank-statement-concurrency.log; then
            echo "::error::bank-statement-concurrency.integration.test.ts SKIPPED — gate tidak boleh lulus tanpa tes jalan."
            exit 1
          fi
          if ! grep -Eq '[0-9]+ passed' bank-statement-concurrency.log; then
            echo "::error::bank-statement-concurrency.integration.test.ts tidak melaporkan tes lulus."
            exit 1
          fi
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
          INTEGRATION_DB_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - name: Run DB integration tests (bulk payroll concurrency, MySQL nyata)
        # Anti-skip sama seperti bank statement: suite SKIP tanpa
        # INTEGRATION_DB_URL, hijau semu dilarang. Gap LOW audit #672
        # (t_31eab0e0 -> t_44b6862a): konkurensi irisan generateBulkPayroll
        # wajib terbukti di dua transaksi MySQL nyata, bukan mock.
        run: |
          set -o pipefail
          ./node_modules/.bin/vitest run src/actions/__tests__/bulk-payroll-concurrency.integration.test.ts 2>&1 | tee bulk-payroll-concurrency.log
          if grep -qi 'skipped' bulk-payroll-concurrency.log; then
            echo "::error::bulk-payroll-concurrency.integration.test.ts SKIPPED — gate tidak boleh lulus tanpa tes jalan."
            exit 1
          fi
          if ! grep -Eq '[0-9]+ passed' bulk-payroll-concurrency.log; then
            echo "::error::bulk-payroll-concurrency.integration.test.ts tidak melaporkan tes lulus."
            exit 1
          fi
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
          INTEGRATION_DB_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - name: Run DB integration tests (JobChangeOrder apply atomicity, MySQL nyata)
        # Anti-skip sama seperti bank statement: suite SKIP tanpa
        # INTEGRATION_DB_URL, hijau semu dilarang. Audit #515 gap MEDIUM-3.
        run: |
          set -o pipefail
          ./node_modules/.bin/vitest run src/actions/__tests__/job-change-order-apply-atomicity.integration.test.ts 2>&1 | tee jco-apply-atomicity.log
          if grep -qi 'skipped' jco-apply-atomicity.log; then
            echo "::error::job-change-order-apply-atomicity.integration.test.ts SKIPPED — gate tidak boleh lulus tanpa tes jalan."
            exit 1
          fi
          if ! grep -Eq '[0-9]+ passed' jco-apply-atomicity.log; then
            echo "::error::job-change-order-apply-atomicity.integration.test.ts tidak melaporkan tes lulus."
            exit 1
          fi
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
          INTEGRATION_DB_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
      - name: Run DB integration tests (journal active-reference unique, MySQL nyata)
        # Anti-skip sama seperti bank statement. Bukti fisik E127-8/E127-8b
        # (F-2026-10-23-127-V Putusan 4, PR #664): re-post sesudah reversal
        # lolos unik aktif-saja, jurnal aktif kedua tetap P2002.
        run: |
          set -o pipefail
          ./node_modules/.bin/vitest run src/lib/hooks/__tests__/journal-active-reference.integration.test.ts 2>&1 | tee journal-active-reference.log
          if grep -qi 'skipped' journal-active-reference.log; then
            echo "::error::journal-active-reference.integration.test.ts SKIPPED — gate tidak boleh lulus tanpa tes jalan."
            exit 1
          fi
          if ! grep -Eq '[0-9]+ passed' journal-active-reference.log; then
            echo "::error::journal-active-reference.integration.test.ts tidak melaporkan tes lulus."
            exit 1
          fi
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true
          INTEGRATION_DB_URL: mysql://root@127.0.0.1:3306/yara_erp?allowPublicKeyRetrieval=true

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [changes, lint]
    # Push ke main: selalu (gerbang akhir). PR: hanya bila file terkait image
    # berubah (output `docker` dari Detect Changes) — job ini bukan check
    # wajib branch protection, jadi skip di sini tidak menyangkut PR.
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.docker == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build production image
        run: docker buildx build --load --progress=plain --platform linux/amd64 -t silengkap:ci .
      - name: Smoke test production image
        run: docker run --rm silengkap:ci sh -c 'test -r /app/server.js && test ! -e /app/node_modules/tailwindcss/index.css && id -u | grep -qx 1001'
