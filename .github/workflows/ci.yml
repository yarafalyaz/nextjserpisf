name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: npx eslint .
      - run: npx tsc --noEmit

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: npx vitest run
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp

  e2e-setup:
    name: E2E Auth Setup
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx prisma db push
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx scripts/seed-remaining-e2e.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - name: Run Auth Setup
        run: npx playwright test --project=setup --workers=1
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-secret
          AUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
      - name: Upload Auth State
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth
          path: e2e/.auth/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: "E2E Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, unit, e2e-setup]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tune MariaDB
        run: |
          mariadb -h 127.0.0.1 -u root -e "SET GLOBAL max_connections=200; SET GLOBAL wait_timeout=600; SET GLOBAL interactive_timeout=600;" 
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx prisma db push
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx tsx scripts/seed-remaining-e2e.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: npx playwright install --with-deps chromium
      - name: Download Auth State
        uses: actions/download-artifact@v4
        with:
          name: playwright-auth
          path: e2e/.auth
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - name: Run E2E Tests
        run: npx playwright test --project=chromium --no-deps --workers=1 --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-secret
          AUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
          PW_WORKERS: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
