name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Mirror the deployment timezone (docker-compose sets TZ=Asia/Jakarta for the app
  # and the DB). Without it CI runs in UTC and misses the whole class of date bugs
  # where a local-time derivation differs from the UTC one: the report presets and
  # the "today" default of every create form were off by one day only east of UTC.
  TZ: Asia/Jakarta

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: ./node_modules/.bin/eslint .
      - run: ./node_modules/.bin/tsc --noEmit

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@localhost:3306/dummy
      - run: ./node_modules/.bin/vitest run
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp

  e2e-setup:
    name: E2E Auth Setup
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      # `migrate deploy`, bukan `db push`: rantai migrasi sudah diverifikasi bisa
      # mereproduksi skema dari DB kosong (drift 0). Dengan ini ketidaksesuaian skema vs
      # migrasi GAGAL KERAS, bukan tertutupi — konsekuensinya setiap perubahan skema
      # wajib menyertakan migrasinya.
      - run: ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: ./node_modules/.bin/tsx prisma/seed.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          # Seed guard: demo users (9 akun) hanya dibuat bila eksplisit
          # diizinkan + password admin disediakan. CI butuh akun demo untuk
          # login E2E (E2E_PASSWORD), jadi guard ON di sini.
          ALLOW_DEMO_SEED: "true"
          SEED_ADMIN_PASSWORD: Yara1234
      - run: ./node_modules/.bin/tsx scripts/seed-remaining-e2e.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - name: Run DB integration tests (FIFO/multi-UoM/batch/serial engine)
        run: RUN_DB_INTEGRATION=1 ./node_modules/.bin/vitest run src/lib/services/__tests__/inventory-integration.test.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - name: Run Auth Setup
        run: ./node_modules/.bin/playwright test --project=setup --workers=1
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          # 32+ chars: src/lib/env.ts menolak AUTH_SECRET < 32 (sesi JWE bisa
          # dipalsukan). "ci-secret" (9 char) bikin SEMUA halaman dashboard 500
          # di job E2E — 194 tes gagal @10s sampai job kena timeout 40 menit.
          NEXTAUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"

  e2e:
    name: "E2E Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, unit, e2e-setup]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: yara_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tune MariaDB
        run: |
          mysql -h 127.0.0.1 -u root -e "SET GLOBAL max_connections=200; SET GLOBAL wait_timeout=600; SET GLOBAL interactive_timeout=600;" 
      - run: ./node_modules/.bin/prisma generate
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      # `migrate deploy`, bukan `db push`: rantai migrasi sudah diverifikasi bisa
      # mereproduksi skema dari DB kosong (drift 0). Dengan ini ketidaksesuaian skema vs
      # migrasi GAGAL KERAS, bukan tertutupi — konsekuensinya setiap perubahan skema
      # wajib menyertakan migrasinya.
      - run: ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: ./node_modules/.bin/tsx prisma/seed.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          # Seed guard ON: E2E butuh akun demo (E2E_PASSWORD).
          ALLOW_DEMO_SEED: "true"
          SEED_ADMIN_PASSWORD: Yara1234
      - run: ./node_modules/.bin/tsx scripts/seed-remaining-e2e.ts
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
      - name: Run Auth Setup
        # Login HARUS di job ini, bukan diambil dari artifact job e2e-setup:
        # token sesi mengikat 12 karakter awal hash password (src/lib/auth/auth.ts)
        # dan bcrypt memakai salt acak, jadi tiap job yang men-seed DB sendiri
        # menghasilkan hash berbeda. Cookie dari job lain langsung dicabut ->
        # semua halaman dashboard redirect /login?reason=deactivated.
        run: ./node_modules/.bin/playwright test --project=setup --workers=1
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          NEXTAUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
      - name: Run E2E Tests
        # Both viewports: the mobile project guards a whole surface (drawers,
        # card lists, `lg:hidden` toolbars) that chromium alone never touches -
        # 331 mobile tests were previously never executed anywhere.
        run: ./node_modules/.bin/playwright test --project=chromium --project=mobile-chrome --no-deps --workers=1 --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/yara_erp
          # 32+ chars: src/lib/env.ts menolak AUTH_SECRET < 32 (sesi JWE bisa
          # dipalsukan). "ci-secret" (9 char) bikin SEMUA halaman dashboard 500
          # di job E2E — 194 tes gagal @10s sampai job kena timeout 40 menit.
          NEXTAUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          AUTH_SECRET: ci-e2e-secret-0123456789abcdef0123456789
          NEXTAUTH_URL: http://localhost:4101
          AUTH_TRUST_HOST: "true"
          E2E_PORT: "4101"
          PW_WORKERS: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30
          # Shard yang hijau tidak menghasilkan direktori ini; tanpa baris ini CI
          # menandai "No files were found" sebagai anotasi yang menyamarkan
          # kegagalan sungguhan.
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
