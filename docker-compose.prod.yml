services:
  # One-shot migration step: run explicitly on every release BEFORE starting
  # app (`docker compose -f docker-compose.prod.yml up migrate`), never as
  # part of the app boot. `migrate deploy` fails the release when the chain
  # cannot apply — the app never boots on a half-migrated schema.
  # IMAGE_TAG is pinned per release (see scripts/build-amd64.sh); it must
  # never be `latest` so a release can always roll back to an exact build.
  migrate:
    image: yekristanto/silengkap:${IMAGE_TAG}
    container_name: silengkap_migrate
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=mysql://${DB_USER:-silengkap_user}:${DB_PASSWORD:?set DB_PASSWORD di .env produksi}@db:3306/${DB_NAME:-silengkap}
    command: ["sh", "-c", "node scripts/pre-migrate-column-audit.mjs && ./node_modules/.bin/prisma migrate deploy"]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: yekristanto/silengkap:${IMAGE_TAG}
    container_name: silengkap_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=mysql://${DB_USER:-silengkap_user}:${DB_PASSWORD:?set DB_PASSWORD di .env produksi}@db:3306/${DB_NAME:-silengkap}
      - AUTH_URL=https://erp.yarasoft.net
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=https://erp.yarasoft.net
      - AUTH_TRUST_HOST=true
      # Production is served through Cloudflare, which rewrites the client-IP
      # headers. Trusting them is required for per-client rate limiting (login
      # brute-force, uploads, API). Do NOT set this on a deployment that is
      # exposed directly - the headers would then be spoofable.
      - TRUSTED_PROXY=1
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  # Sinkronisasi hari libur nasional: memanggil endpoint cron aplikasi
  # dari DALAM jaringan compose (tidak ada port publik baru). Endpoint
  # aplikasi (/api/cron/sync-holidays) sudah berjalan di container app;
  # service ini hanya pemicunya: sekali saat start (dengan retry sampai
  # app siap), lalu tiap 30 hari. Sync idempoten dan tidak pernah
  # menimpa koreksi tanggal yang dibuat HR. Butuh CRON_SECRET yang sama
  # dengan yang dipakai aplikasi (dari .env, penjaga isValidCronRequest).
  holiday-sync:
    image: curlimages/curl:8.10.1
    container_name: silengkap_holiday_sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      - app
    command:
      - sh
      - -c
      - |
        for i in $(seq 1 12); do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/sync-holidays && break || sleep 10
        done
        while true; do
          sleep 2592000
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/sync-holidays || echo "holiday-sync: panggilan gagal, dicoba lagi siklus berikutnya"
        done

  db:
    image: mysql:8.0
    container_name: silengkap_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME:-silengkap}
      - MYSQL_USER=${DB_USER:-silengkap_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD di .env produksi}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD di .env produksi}
      - TZ=Asia/Jakarta
    # P2-4: port DB TIDAK dipublish — hanya app di network compose yang boleh
    # bicara ke MySQL. Akses admin via tunnel/ssh, bukan port publik.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
