services:
  # One-shot migration step: run explicitly on every release BEFORE starting
  # app (`docker compose -f docker-compose.prod.yml up migrate`), never as
  # part of the app boot. `migrate deploy` fails the release when the chain
  # cannot apply — the app never boots on a half-migrated schema.
  # IMAGE_TAG is pinned per release (see scripts/build-amd64.sh); it must
  # never be `latest` so a release can always roll back to an exact build.
  migrate:
    image: yekristanto/silengkap:${IMAGE_TAG}
    container_name: silengkap_migrate
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=mysql://${DB_USER:-silengkap_user}@db:3306/${DB_NAME:-silengkap}
    command: ["sh", "-c", "npx prisma migrate deploy"]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: yekristanto/silengkap:${IMAGE_TAG}
    container_name: silengkap_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=mysql://${DB_USER:-silengkap_user}:${DB_PASSWORD:-silengkap_pass123}@db:3306/${DB_NAME:-silengkap}
      - AUTH_URL=https://erp.yarasoft.net
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=https://erp.yarasoft.net
      - AUTH_TRUST_HOST=true
      # Production is served through Cloudflare, which rewrites the client-IP
      # headers. Trusting them is required for per-client rate limiting (login
      # brute-force, uploads, API). Do NOT set this on a deployment that is
      # exposed directly - the headers would then be spoofable.
      - TRUSTED_PROXY=1
    ports:
      - "3003:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: silengkap_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME:-silengkap}
      - MYSQL_USER=${DB_USER:-silengkap_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-silengkap_pass123}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password_change_me}
      - TZ=Asia/Jakarta
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
